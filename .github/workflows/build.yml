name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Linux is the verified platform: only this job gates the auto-release,
  # so macOS/Windows hiccups can never block a Linux release.
  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            ccache xvfb libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: ccache cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test (under Xvfb)
        run: xvfb-run -a ./build/MonoHarness_artefacts/Release/MonoHarness

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Monosynth-Linux-VST3
          path: build/Monosynth_artefacts/Release/VST3/Monosynth.vst3

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Monosynth-Linux-Standalone
          path: build/Monosynth_artefacts/Release/Standalone/Monosynth

  # Best-effort desktop builds (see README: not yet verified here).
  build-other:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS
            vst3: build/Monosynth_artefacts/Release/VST3/Monosynth.vst3
            standalone: build/Monosynth_artefacts/Release/Standalone/Monosynth.app
          - os: windows-2022
            label: Windows
            vst3: build/Monosynth_artefacts/Release/VST3/Monosynth.vst3
            standalone: build/Monosynth_artefacts/Release/Standalone/Monosynth.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: ccache cache (macOS)
        if: runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: ./build/MonoHarness_artefacts/Release/MonoHarness

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: build\MonoHarness_artefacts\Release\MonoHarness.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Monosynth-${{ matrix.label }}-VST3
          path: ${{ matrix.vst3 }}

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Monosynth-${{ matrix.label }}-Standalone
          path: ${{ matrix.standalone }}

  release:
    name: Auto-release
    needs: [build-linux, build-other]
    # Runs whenever Linux is green on main, even if macOS/Windows failed.
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip bundles and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          for d in Monosynth-*/; do
            n="${d%/}"
            (cd "$n" && zip -qr "../${n}.zip" .)
          done
          ls *.zip
          TAG="auto-build-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Auto build $TAG" \
            --notes "Automated CI build from ${{ github.sha }}. Personal project, provided as-is without warranty." \
            *.zip
